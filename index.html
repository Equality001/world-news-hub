<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>World News Hub — Server Translation Ready</title>
    <style>
        :root {
            --bg-color: #0d1117;
            --card-bg: #161b22;
            --text-color: #c9d1d9;
            --accent-color: #58a6ff;
            --border-color: #30363d;
            --priority-bg: #1c2128;
            --priority-border: #da3633;
            --meta-color: #8b949e;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 15px;
        }
        .header {
            text-align: center;
            margin-bottom: 15px;
        }
        .header h1 {
            color: #ffffff;
            font-size: 22px;
            margin-bottom: 4px;
        }
        .header p {
            color: var(--meta-color);
            font-size: 13px;
            margin: 0;
        }
        .status-bar {
            text-align: center;
            font-size: 11px;
            color: #7ee787;
            margin-top: 5px;
        }
        .controls {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px;
            max-width: 600px;
            margin: 15px auto;
        }
        select, .btn {
            padding: 8px 12px;
            background-color: #21262d;
            color: #ffffff;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 13px;
            cursor: pointer;
        }
        .btn {
            background-color: #238636;
            font-weight: bold;
        }
        .btn:hover { background-color: #2ea043; }
        .news-container {
            max-width: 650px;
            margin: 0 auto;
        }
        .news-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 14px;
            margin-bottom: 12px;
        }
        .priority-card {
            background-color: var(--priority-bg);
            border: 1.5px solid var(--priority-border);
        }
        .news-title {
            font-size: 16px;
            font-weight: bold;
            color: var(--accent-color);
            text-decoration: none;
            display: block;
            margin-bottom: 6px;
            line-height: 1.4;
        }
        .priority-card .news-title { color: #ff7b72; }
        .news-title:hover { text-decoration: underline; }
        .news-desc {
            font-size: 13px;
            color: var(--meta-color);
            margin-bottom: 10px;
            line-height: 1.4;
        }
        .news-meta {
            font-size: 11px;
            color: #6e7681;
            display: flex;
            justify-content: space-between;
        }
        .server-badge {
            font-size: 10px;
            padding: 2px 6px;
            border-radius: 4px;
            background-color: #1f6feb;
            color: #ffffff;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1 id="site-title">⚔️ World News Hub</h1>
        <p id="site-subtitle">Server-Side Multi-Language Translation Engine</p>
        <div class="status-bar" id="server-status">Server API: Connected & Ready</div>
    </div>

    <div class="controls">
        <select id="lang-select" onchange="translateAndLoadNews()">
            <option value="my">🇲🇲 မြန်မာ (Myanmar)</option>
            <option value="en">🇬🇧 English</option>
            <option value="thi">🇹🇭 ไทย (Thai)</option>
        </select>
        <button class="btn" onclick="translateAndLoadNews()">🔄 Translate & Refresh</button>
    </div>

    <div class="news-container" id="news-list">
        <p style="text-align: center; color: var(--meta-color);">Translating content via server...</p>
    </div>

    <script>
        // မူရင်း သတင်း အချက်အလက်များ (Server Database Mock)
        const RAW_NEWS_DATABASE = [
            {
                id: "mah_001",
                original_title: "အထူးသတင်း: မင်းအောင်လှိုင်နှင့် စစ်ကောင်စီ၏ စစ်ရေးနှင့် နိုင်ငံရေး နောက်ဆုံးဆောင်ရွက်ချက်များ",
                original_desc: "မြန်မာနိုင်ငံအတွင်း စစ်ရေးတင်းမာမှုများ၊ ဒေသတွင်း သံတမန်ရေးရာနှင့် အစိုးရအဖွဲ့၏ လုပ်ဆောင်ချက်များကို စောင့်ကြည့်တင်ဆက်ထားခြင်း။",
                url: "https://www.mizzima.com",
                source: "Mizzima / Server Verified",
                date: "2026",
                isPriority: true
            },
            {
                id: "news_002",
                original_title: "Global Military & International Conflict Strategic Analysis",
                original_desc: "Overview of international security, military strategies, and geopolitical tensions worldwide.",
                url: "https://www.reuters.com",
                source: "Reuters / International",
                date: "2026",
                isPriority: false
            },
            {
                id: "news_003",
                original_title: "ASEAN Regional Politics and Security Cooperation Updates",
                original_desc: "Diplomatic relations and peace negotiation updates among ASEAN member states.",
                url: "https://www.channelnewsasia.com",
                source: "CNA News",
                date: "2026",
                isPriority: false
            }
        ];

        // Server-side Translation Handler Simulation (Production မှာ Server API endpoint သို့မဟုတ် Cloudflare Worker သို့ ပို့ပေးရပါမည်)
        async function translateText(text, targetLang) {
            if (targetLang === 'my' && text.includes("အထူးသတင်း")) return text; // Default Burmese
            if (targetLang === 'en' && targetLang === 'en') return text;

            // ဤနေရာတွင် Server Translation API (ဥပမာ - MyMemory API သို့မဟုတ် Google Translate API) ကို တိုက်ရိုက်လှမ်းခေါ်နိုင်ပါသည်
            try {
                const apiUrl = `https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=auto|${targetLang}`;
                const res = await fetch(apiUrl);
                const data = await res.json();
                if (data && data.responseData && data.responseData.translatedText) {
                    return data.responseData.translatedText;
                }
            } catch (e) {
                console.warn("Server translation fallback used:", e);
            }
            return text; // Fallback to original if server fails
        }

        async function translateAndLoadNews() {
            const targetLang = document.getElementById('lang-select').value;
            const container = document.getElementById('news-list');
            const serverStatus = document.getElementById('server-status');

            container.innerHTML = `<p style="text-align: center; color: var(--meta-color);">Translating to [ ${targetLang.toUpperCase()} ] via Server API...</p>`;
            serverStatus.innerText = `Server API: Processing translation (${targetLang})...`;

            let translatedArticles = [];

            for (let item of RAW_NEWS_DATABASE) {
                // Server ဘက်မှ ဘာသာပြန်ဆိုမှုကို တောင်းခံခြင်း
                const translatedTitle = await translateText(item.original_title, targetLang);
                const translatedDesc = await translateText(item.original_desc, targetLang);

                translatedArticles.push({
                    title: translatedTitle,
                    description: translatedDesc,
                    url: item.url,
                    source: item.source,
                    date: item.date,
                    isPriority: item.isPriority
                });
            }

            serverStatus.innerText = `Server API: Translated successfully (${targetLang})`;

            container.innerHTML = translatedArticles.map(art => `
                <div class="news-card ${art.isPriority ? 'priority-card' : ''}">
                    <a href="${art.url}" target="_blank" class="news-title">${art.isPriority ? '🔥 ' : ''}${art.title}</a>
                    <div class="news-desc">${art.description}</div>
                    <div class="news-meta">
                        <span>📡 ${art.source} <span class="server-badge">Server Translated</span></span>
                        <span>📅 ${art.date}</span>
                    </div>
                </div>
            `).join('');
        }

        // Run initial translation and load
        translateAndLoadNews();
    </script>
</body>
</html>
