<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>World News Hub — Global Military & Geopolitics</title>
    <style>
        :root {
            --bg-color: #0d1117;
            --card-bg: #161b22;
            --text-color: #c9d1d9;
            --accent-color: #58a6ff;
            --border-color: #30363d;
            --priority-bg: #1c2128;
            --priority-border: #da3633;
            --meta-color: #8b949e;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 15px;
        }
        .header {
            text-align: center;
            margin-bottom: 15px;
        }
        .header h1 {
            color: #ffffff;
            font-size: 22px;
            margin-bottom: 4px;
        }
        .header p {
            color: var(--meta-color);
            font-size: 13px;
            margin: 0;
        }
        .status-bar {
            text-align: center;
            font-size: 11px;
            color: #7ee787;
            margin-top: 5px;
        }
        .controls {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px;
            max-width: 600px;
            margin: 15px auto;
        }
        select, input, .btn {
            padding: 8px 12px;
            background-color: #21262d;
            color: #ffffff;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 13px;
        }
        .btn {
            background-color: #238636;
            font-weight: bold;
            cursor: pointer;
        }
        .btn:hover { background-color: #2ea043; }
        .news-container {
            max-width: 650px;
            margin: 0 auto;
        }
        .news-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 14px;
            margin-bottom: 12px;
        }
        .priority-card {
            background-color: var(--priority-bg);
            border: 1.5px solid var(--priority-border);
        }
        .news-title {
            font-size: 16px;
            font-weight: bold;
            color: var(--accent-color);
            text-decoration: none;
            display: block;
            margin-bottom: 6px;
            line-height: 1.4;
        }
        .priority-card .news-title { color: #ff7b72; }
        .news-title:hover { text-decoration: underline; }
        .news-desc {
            font-size: 13px;
            color: var(--meta-color);
            margin-bottom: 10px;
            line-height: 1.4;
        }
        .news-meta {
            font-size: 11px;
            color: #6e7681;
            display: flex;
            justify-content: space-between;
        }
        .verification-tag {
            font-size: 10px;
            padding: 2px 6px;
            border-radius: 4px;
            background-color: #21262d;
            color: #d2a8ff;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1 id="site-title">⚔️ World News Hub</h1>
        <p id="site-subtitle">Global Military & Geopolitical News Source</p>
        <div class="status-bar" id="last-update-time">Last Sync: Not Updated</div>
    </div>

    <div class="controls">
        <select id="lang-select" onchange="loadNews()">
            <option value="my">🇲🇲 မြန်မာ (Myanmar)</option>
            <option value="en">🇬🇧 English</option>
            <option value="thi">🇹🇭 ไทย (Thai)</option>
