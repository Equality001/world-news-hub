<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>World News Hub - Live News</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #e0e0e0;
            margin: 0;
            padding: 15px;
        }
        h1 {
            color: #ffffff;
            font-size: 24px;
            margin-bottom: 15px;
        }
        .controls {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 20px;
        }
        select, input, button {
            padding: 10px;
            background-color: #1e1e1e;
            color: #ffffff;
            border: 1px solid #333;
            border-radius: 5px;
            font-size: 16px;
        }
        button {
            background-color: #0066cc;
            cursor: pointer;
            border: none;
        }
        button:hover {
            background-color: #0055b3;
        }
        .news-card {
            background-color: #1e1e1e;
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 8px;
            border: 1px solid #333;
        }
        .news-title {
            font-size: 18px;
            font-weight: bold;
            color: #4dabf7;
            text-decoration: none;
            display: block;
            margin-bottom: 8px;
        }
        .news-desc {
            font-size: 14px;
            color: #b0b0b0;
            margin-bottom: 10px;
        }
        .news-source {
            font-size: 12px;
            color: #888;
        }
        .loading, .error-msg {
            text-align: center;
            padding: 20px;
            color: #888;
        }
    </style>
</head>
<body>

    <h1>World News Hub</h1>
    
    <div class="controls">
        <select id="lang-select" onchange="fetchNews()">
            <option value="my">မြန်မာ</option>
            <option value="en">English</option>
        </select>
        
        <button onclick="fetchNews()">🔄 Refresh News</button>
        
        <input type="text" id="search-box" placeholder="Search news..." onkeyup="filterNews()">
        
        <select id="source-select" onchange="filterNews()">
            <option value="all">All Sources</option>
            <option value="Mizzima">Mizzima (Custom)</option>
            <option value="Global News">Global News</option>
        </select>
    </div>

    <div id="news-container"></div>

    <script>
        let allArticles = [];

        async function fetchNews() {
            const container = document.getElementById('news-container');
            container.innerHTML = '<div class="loading">Loading live news...</div>';

            try {
                // Fetching free public news API for real-time headlines
                const response = await fetch('https://api.spaceflightnewsapi.net/v4/articles/?limit=10');
                const data = await response.json();
                
                // Map API data to standard format
                const apiArticles = data.results.map(item => ({
                    title: item.title,
                    description: item.summary,
                    url: item.url,
                    publishedAt: item.published_at,
                    sourceName: "Global News"
                }));

                // Custom / Mizzima sample updates placeholder (Can be updated manually or via RSS proxy)
                const mizzimaArticles = [
                    {
                        title: "Mizzima: Latest Updates & International Headlines",
                        description: "Explore ongoing regional and international news coverages updated for Burmese readers.",
                        url: "https://www.mizzima.com",
                        publishedAt: new Date().toISOString(),
                        sourceName: "Mizzima"
                    }
                ];

                allArticles = [...mizzimaArticles, ...apiArticles];
                displayNews(allArticles);

            } catch (error) {
                container.innerHTML = '<div class="error-msg">သတင်းများ ဆွဲထုတ်ရာတွင် အမှားအယွင်းရှိท (Failed to load live news)</div>';
            }
        }

        function displayNews(articles) {
            const container = document.getElementById('news-container');
            if (articles.length === 0) {
                container.innerHTML = '<div class="error-msg">သတင်းရှာမတွေ့ပါ။ (No news found)</div>';
                return;
            }

            container.innerHTML = articles.map(article => `
                <div class="news-card">
                    <a href="${article.url}" target="_blank" class="news-title">${article.title}</a>
                    <div class="news-desc">${article.description || ''}</div>
                    <div class="news-source">Source: ${article.sourceName}</div>
                </div>
            `).join('');
        }

        function filterNews() {
            const searchQuery = document.getElementById('search-box').value.toLowerCase();
            const selectedSource = document.getElementById('source-select').value;

            const filtered = allArticles.filter(article => {
                const matchesSearch = article.title.toLowerCase().includes(searchQuery) || 
                                      (article.description && article.description.toLowerCase().includes(searchQuery));
                const matchesSource = selectedSource === 'all' || article.sourceName === selectedSource;
                return matchesSearch && matchesSource;
            });

            displayNews(filtered);
        }

        // Initial load
        fetchNews();
    </script>
</body>
</html>
