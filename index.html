<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>World News Hub - Mizzima News</title>
    <style>
        :root {
            --bg-color: #0d1117;
            --card-bg: #161b22;
            --text-color: #c9d1d9;
            --accent-color: #58a6ff;
            --border-color: #30363d;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }
        .header {
            text-align: center;
            margin-bottom: 25px;
        }
        .header h1 {
            color: #ffffff;
            font-size: 26px;
            margin-bottom: 5px;
        }
        .header p {
            color: #8b949e;
            font-size: 14px;
        }
        .news-container {
            max-width: 600px;
            margin: 0 auto;
        }
        .news-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .news-title {
            font-size: 18px;
            font-weight: bold;
            color: var(--accent-color);
            text-decoration: none;
            display: block;
            margin-bottom: 8px;
        }
        .news-title:hover {
            text-decoration: underline;
        }
        .news-desc {
            font-size: 14px;
            color: #8b949e;
            margin-bottom: 12px;
            line-height: 1.4;
        }
        .news-meta {
            font-size: 12px;
            color: #6e7681;
            display: flex;
            justify-content: space-between;
        }
        .btn-group {
            display: flex;
            gap: 10px;
            max-width: 400px;
            margin: 0 auto 20px auto;
        }
        .action-btn {
            flex: 1;
            padding: 10px;
            background-color: #238636;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 15px;
            cursor: pointer;
            font-weight: bold;
            text-align: center;
        }
        .action-btn:hover {
            background-color: #2ea043;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>🇲🇲 Mizzima News Hub</h1>
        <p>Latest updates from Mizzima Media</p>
    </div>

    <div class="btn-group">
        <button class="action-btn" onclick="loadMizzimaNews()">🔄 Load Mizzima</button>
        <a href="https://www.mizzima.com" target="_blank" class="action-btn" style="text-decoration: none; background-color: #1f6feb;">🌐 Visit Mizzima</a>
    </div>

    <div class="news-container" id="news-list">
        <p style="text-align: center; color: #8b949e;">Loading Mizzima news...</p>
    </div>

    <script>
        async function loadMizzimaNews() {
            const container = document.getElementById('news-list');
            container.innerHTML = '<p style="text-align: center; color: #8b949e;">Fetching Mizzima headlines...</p>';

            try {
                // Using RSS2JSON proxy to safely fetch Mizzima RSS feed without CORS errors
                const rssUrl = 'https://www.mizzima.com/feed';
                const apiUrl = `https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(rssUrl)}`;
                
                const res = await fetch(apiUrl);
                const data = await res.json();

                if (data.status === 'ok' && data.items.length > 0) {
                    const articles = data.items.map(item => ({
                        title: item.title,
                        description: item.description.replace(/<[^>]*>?/gm, '').substring(0, 150) + '...', // Strip HTML tags for cleaner summary
                        url: item.link,
                        date: new Date(item.pubDate).toLocaleDateString()
                    }));

                    container.innerHTML = articles.map(art => `
                        <div class="news-card">
                            <a href="${art.url}" target="_blank" class="news-title">${art.title}</a>
                            <div class="news-desc">${art.description}</div>
                            <div class="news-meta">
                               <span>📡 Mizzima News</span>
                               <span>📅 ${art.date}</span>
                            </div>
                        </div>
                    `).join('');
                } else {
                    throw new Error('No items found');
                }

            } catch (err) {
                // Fallback display if RSS proxy fails or blocks
                container.innerHTML = `
                    <div class="news-card">
                        <a href="https://www.mizzima.com" target="_blank" class="news-title">မဇ္ဈိမ သတင်းဌာန (တရားဝင်ဝဘ်ဆိုက်သို့ သွားရန်)</a>
                        <div class="news-desc">လက်ရှိတွင် Mizzima RSS feed ကို တိုက်ရိုက်ဆွဲထုတ်ရာ၌ ကန့်သတ်ချက်ရှိနေပါသဖြင့် အောက်ပါလင့်ခ်မှတစ်ဆင့် တိုက်ရိုက်ဖတ်ရှုနိုင်ပါသည်။</div>
                        <div class="news-meta">
                            <span>📡 Mizzima Official</span>
                            <span>⚡ Live Link</span>
                        </div>
                    </div>
                `;
            }
        }

        // Run on load
        loadMizzimaNews();
    </script>
</body>
</html>
