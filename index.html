<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Private World News Hub</title>
    <style>
        :root {
            --bg-color: #0d1117;
            --card-bg: #161b22;
            --text-color: #c9d1d9;
            --accent-color: #58a6ff;
            --border-color: #30363d;
            --priority-bg: #1c2128;
            --priority-border: #da3633;
            --meta-color: #8b949e;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 15px;
        }
        /* Password Screen Style */
        #auth-screen {
            max-width: 400px;
            margin: 100px auto;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 25px;
            text-align: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        #auth-screen h2 {
            color: #ffffff;
            margin-bottom: 10px;
        }
        #auth-screen p {
            color: var(--meta-color);
            font-size: 13px;
            margin-bottom: 20px;
        }
        #auth-screen input {
            width: 80%;
            padding: 10px;
            background-color: #21262d;
            color: #ffffff;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            margin-bottom: 15px;
            font-size: 14px;
            text-align: center;
        }
        .btn {
            padding: 10px 20px;
            background-color: #238636;
            color: #ffffff;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
        }
        .btn:hover { background-color: #2ea043; }
        .error-msg {
            color: #f85149;
            font-size: 12px;
            margin-top: 10px;
        }

        /* Main Content Style (Hidden by default until login) */
        #main-content {
            display: none;
        }
        .header {
            text-align: center;
            margin-bottom: 15px;
        }
        .header h1 {
            color: #ffffff;
            font-size: 22px;
            margin-bottom: 4px;
        }
        .header p {
            color: var(--meta-color);
            font-size: 13px;
            margin: 0;
        }
        .controls {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px;
            max-width: 600px;
            margin: 15px auto;
        }
        select, .action-btn {
            padding: 8px 12px;
            background-color: #21262d;
            color: #ffffff;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 13px;
            cursor: pointer;
        }
        .news-container {
            max-width: 650px;
            margin: 0 auto;
        }
        .news-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 14px;
            margin-bottom: 12px;
        }
        .priority-card {
            background-color: var(--priority-bg);
            border: 1.5px solid var(--priority-border);
        }
        .news-title {
            font-size: 16px;
            font-weight: bold;
            color: var(--accent-color);
            text-decoration: none;
            display: block;
            margin-bottom: 6px;
            line-height: 1.4;
        }
        .priority-card .news-title { color: #ff7b72; }
        .news-title:hover { text-decoration: underline; }
        .news-desc {
            font-size: 13px;
            color: var(--meta-color);
            margin-bottom: 10px;
            line-height: 1.4;
        }
        .news-meta {
            font-size: 11px;
            color: #6e7681;
            display: flex;
            justify-content: space-between;
        }
        .server-badge {
            font-size: 10px;
            padding: 2px 6px;
            border-radius: 4px;
            background-color: #1f6feb;
            color: #ffffff;
        }
    </style>
</head>
<body>

    <!-- 🔒 Password Login Screen -->
    <div id="auth-screen">
        <h2>🔒 Private Portal</h2>
        <p>ဤဝဘ်ဆိုက်ကို ဝင်ရောက်ရန် စကားဝှက် ထည့်သွင်းပါ</p>
        <input type="password" id="password-input" placeholder="Password ရိုက်ထည့်ပါ" onkeypress="checkEnter(event)">
        <br>
        <button class="btn" onclick="verifyPassword()">ဝင်မည် (Login)</button>
        <div id="error-container" class="error-msg"></div>
    </div>

    <!-- 🌐 Main Portal Content -->
    <div id="main-content">
        <div class="header">
            <h1 id="site-title">⚔️ Private World News Hub</h1>
            <p id="site-subtitle">Server-Side Multi-Language Translation Engine</p>
        </div>

        <div class="controls">
            <select id="lang-select" onchange="translateAndLoadNews()">
                <option value="my">🇲🇲 မြန်မာ (Myanmar)</option>
                <option value="en">🇬🇧 English</option>
                <option value="thi">🇹🇭 ไทย (Thai)</option>
            </select>
            <button class="action-btn" onclick="translateAndLoadNews()">🔄 Translate & Refresh</button>
            <button class="action-btn" style="background-color: #da3633;" onclick="logout()">🚪 ထွက်မည်</button>
        </div>

        <div class="news-container" id="news-list">
            <p style="text-align: center; color: var(--meta-color);">Translating content via server...</p>
        </div>
    </div>

    <script>
        // 🔑 ဤနေရာတွင် သူငယ်ချင်းကို ပေးမည့် Password ကို ပြောင်းလဲနိုင်ပါသည်
        const CORRECT_PASSWORD = "NNNNNNkto2026";

        function verifyPassword() {
            const inputVal = document.getElementById('password-input').value;
            const errorEl = document.getElementById('error-container');

            if (inputVal === CORRECT_PASSWORD) {
                document.getElementById('auth-screen').style.display = 'none';
                document.getElementById('main-content').style.display = 'block';
                localStorage.setItem('portal_auth', 'true');
                translateAndLoadNews();
            } else {
                errorEl.innerText = "❌ စကားဝှက် မှားယွင်းနေပါသည်။ ထပ်ကြိုးစားပါ။";
            }
        }

        function checkEnter(e) {
            if (e.key === 'Enter') {
                verifyPassword();
            }
        }

        function logout() {
            localStorage.removeItem('portal_auth');
            location.reload();
        }

        // Auto login if session already authenticated
        window.onload = function() {
            if (localStorage.getItem('portal_auth') === 'true') {
                document.getElementById('auth-screen').style.display = 'none';
                document.getElementById('main-content').style.display = 'block';
                translateAndLoadNews();
            }
        };

        const RAW_NEWS_DATABASE = [
            {
                id: "mah_001",
                original_title: "အထူးသတင်း: မင်းအောင်လှိုင်နှင့် စစ်ကောင်စီ၏ စစ်ရေးနှင့် နိုင်ငံရေး နောက်ဆုံးဆောင်ရွက်ချက်များ",
                original_desc: "မြန်မာနိုင်ငံအတွင်း စစ်ရေးတင်းမာမှုများ၊ ဒေသတွင်း သံတမန်ရေးရာနှင့် အစိုးရအဖွဲ့၏ လုပ်ဆောင်ချက်များကို စောင့်ကြည့်တင်ဆက်ထားခြင်း။",
                url: "https://www.mizzima.com",
                source: "Mizzima / Server Verified",
                date: "2026",
                isPriority: true
            },
            {
                id: "news_002",
                original_title: "Global Military & International Conflict Strategic Analysis",
                original_desc: "Overview of international security, military strategies, and geopolitical tensions worldwide.",
                url: "https://www.reuters.com",
                source: "Reuters / International",
                date: "2026",
                isPriority: false
            },
            {
                id: "news_003",
                original_title: "ASEAN Regional Politics and Security Cooperation Updates",
                original_desc: "Diplomatic relations and peace negotiation updates among ASEAN member states.",
                url: "https://www.channelnewsasia.com",
                source: "CNA News",
                date: "2026",
                isPriority: false
            }
        ];

        async function translateText(text, targetLang) {
            if (targetLang === 'my' && text.includes("အထူးသတင်း")) return text;
            if (targetLang === 'en' && targetLang === 'en') return text;

            try {
                const apiUrl = `https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=auto|${targetLang}`;
                const res = await fetch(apiUrl);
                const data = await res.json();
                if (data && data.responseData && data.responseData.translatedText) {
                    return data.responseData.translatedText;
                }
            } catch (e) {
                console.warn("Server translation fallback used:", e);
            }
            return text;
        }

        async function translateAndLoadNews() {
            const targetLang = document.getElementById('lang-select').value;
            const container = document.getElementById('news-list');

            container.innerHTML = `<p style="text-align: center; color: var(--meta-color);">Translating to [ ${targetLang.toUpperCase()} ] via Server API...</p>`;

            let translatedArticles = [];

            for (let item of RAW_NEWS_DATABASE) {
                const translatedTitle = await translateText(item.original_title, targetLang);
                const translatedDesc = await translateText(item.original_desc, targetLang);

                translatedArticles.push({
                    title: translatedTitle,
                    description: translatedDesc,
                    url: item.url,
                    source: item.source,
                    date: item.date,
                    isPriority: item.isPriority
                });
            }

            container.innerHTML = translatedArticles.map(art => `
                <div class="news-card ${art.isPriority ? 'priority-card' : ''}">
                    <a href="${art.url}" target="_blank" class="news-title">${art.isPriority ? '🔥 ' : ''}${art.title}</a>
                    <div class="news-desc">${art.description}</div>
                    <div class="news-meta">
                        <span>📡 ${art.source} <span class="server-badge">Server Translated</span></span>
                        <span>📅 ${art.date}</span>
                    </div>
                </div>
            `).join('');
        }
    </script>
</body>
</html>
